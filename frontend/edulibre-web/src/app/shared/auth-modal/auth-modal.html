<div *ngIf="isOpen()" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
  <div style="width: 100%; max-width: 450px; background-color: white;" class="relative rounded-2xl shadow-2xl overflow-hidden">

    <button (click)="cerrarModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-900">
      <span class="material-symbols-outlined">close</span>
    </button>

    <div class="p-8">
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center text-white font-bold text-xl mx-auto mb-2 shadow-sm">EL</div>
        <h2 class="text-2xl text-primary font-bold">Accede a EduLibre</h2>
        <p class="text-sm text-gray-500 mt-1">Educación abierta, libre y de calidad</p>
      </div>

      <div class="grid grid-cols-2 bg-gray-100 p-1 rounded-lg mb-6">
        <button (click)="cambiarTab('login')"
                [class.bg-white]="tabActual === 'login'"
                [class.shadow-sm]="tabActual === 'login'"
                [class.text-primary]="tabActual === 'login'"
                class="py-2 rounded-md text-sm font-semibold transition-all">
          Iniciar Sesión
        </button>
        <button (click)="cambiarTab('registro')"
                [class.bg-white]="tabActual === 'registro'"
                [class.shadow-sm]="tabActual === 'registro'"
                [class.text-primary]="tabActual === 'registro'"
                class="py-2 rounded-md text-sm font-semibold text-gray-500 hover:text-gray-900 transition-all">
          Crear Cuenta
        </button>
      </div>

      @if (error()) {
        <div class="mb-4 rounded-lg bg-red-50 border border-red-200 px-3 py-2 text-sm text-red-700">
          {{ error() }}
        </div>
      }

      <form *ngIf="tabActual === 'login'" (ngSubmit)="onLogin()" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-1">Correo electrónico</label>
          <input type="email" [(ngModel)]="loginData.email" name="email" placeholder="tu@correo.com" class="w-full bg-gray-50 px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary" required>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-1">Contraseña</label>
          <input type="password" [(ngModel)]="loginData.password" name="password" placeholder="••••••••" class="w-full bg-gray-50 px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary" required>
        </div>
        <button type="submit" [disabled]="cargando()" class="w-full py-3 bg-primary hover:bg-primary-container disabled:opacity-60 text-white rounded-lg font-semibold transition-all">
          {{ cargando() ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>

      <form *ngIf="tabActual === 'registro'" (ngSubmit)="onRegistro()" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-1">Nombre completo</label>
          <input type="text" [(ngModel)]="registroData.nombre" name="nombre" placeholder="Camila Morales" class="w-full bg-gray-50 px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary" required>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-1">Correo electrónico</label>
          <input type="email" [(ngModel)]="registroData.email" name="email" placeholder="tu@correo.com" class="w-full bg-gray-50 px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary" required>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-900 mb-1">Contraseña</label>
          <input type="password" [(ngModel)]="registroData.password" name="password" placeholder="Mínimo 6 caracteres" class="w-full bg-gray-50 px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-secondary" required>
        </div>
        <button type="submit" [disabled]="cargando()" class="w-full py-3 bg-secondary hover:bg-[#005049] disabled:opacity-60 text-white rounded-lg font-semibold transition-all">
          {{ cargando() ? 'Creando cuenta...' : 'Crear Cuenta Gratuita' }}
        </button>
      </form>
    </div>
  </div>
</div>
