<header class="fixed top-0 left-0 right-0 z-40 bg-surface-container-lowest/90 backdrop-blur-xl shadow-sm h-20">
  <div class="max-w-7xl mx-auto px-8 h-full flex items-center justify-between">
    <!-- Logo -->
    <div class="flex items-center gap-4">
      <div class="w-9 h-9 rounded-xl bg-primary flex items-center justify-center text-white font-bold text-lg shadow-sm">EL</div>
      <span class="text-2xl text-primary font-bold tracking-tight">EduLibre</span>
    </div>

    <!-- Navegación (Oculto en móvil por ahora) -->
    <nav class="hidden lg:flex items-center gap-6">
      <a routerLink="/cursos" class="text-sm font-semibold text-gray-600 hover:text-primary transition-colors">Explorar Cursos</a>
      <a routerLink="/" class="text-sm font-semibold text-gray-600 hover:text-primary transition-colors">Inicio</a>
      @if (authService.isLoggedIn()) {
        <a routerLink="/mis-postulaciones" class="text-sm font-semibold text-gray-600 hover:text-primary transition-colors">Mis Postulaciones</a>
      }
      @if (authService.isAdmin()) {
        <a routerLink="/admin" class="text-sm font-semibold text-gray-600 hover:text-primary transition-colors">Panel Admin</a>
      }
    </nav>

    <!-- Botón de Login (Si NO hay sesión) -->
    <div class="flex items-center gap-4">
      @if (!authService.usuarioActual()) {
      <button (click)="abrirLogin()" class="inline-flex items-center justify-center bg-primary hover:bg-primary-container text-white font-semibold px-5 py-2.5 rounded-lg shadow-sm transition-all">
        <span class="material-symbols-outlined text-[18px] mr-2">login</span>
        <span>Iniciar Sesión</span>
      </button>
      } @else {
      <!-- Menú de Usuario (Si HAY sesión) -->
      <div class="flex items-center gap-4">
        <a routerLink="/perfil" class="flex items-center gap-2 hover:bg-gray-50 px-3 py-1.5 rounded-lg transition-colors border border-gray-200">
          <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center font-bold text-sm">
            {{ authService.usuarioActual()?.nombre?.charAt(0) }}
          </div>
          <span class="text-sm font-semibold text-gray-700 hidden sm:block">Mi Panel</span>
        </a>
        <button (click)="logout()" class="text-red-500 hover:bg-red-50 p-2 rounded-lg transition-colors" title="Cerrar Sesión">
          <span class="material-symbols-outlined text-[20px]">logout</span>
        </button>
      </div>
      }
    </div>
  </div>
</header>
