server:
  port: 8080

spring:
  application:
    name: edulibre-api
  datasource:
    url: jdbc:mysql://localhost:3306/edulibre_db?createDatabaseIfNotExist=true&sslMode=REQUIRED&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:admin123}
  jpa:
    hibernate:
      ddl-auto: validate # Usamos Flyway, así que Hibernate no toca el esquema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  mail:
    host: ${MAIL_HOST:smtp-relay.brevo.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Configuración para JWT
jwt:
  secret: ${JWT_SECRET:edulibre-super-secret-key-123456789012345678901234567890}
  expiration: ${JWT_EXPIRATION:86400000} # 24 horas en milisegundos

# Orígenes permitidos para CORS (Angular en 4200 y Nginx en 80/Docker)
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost,http://127.0.0.1:4200,http://127.0.0.1}
  auth:
    cookie:
      name: ${AUTH_COOKIE_NAME:edulibre_token}
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      path: ${AUTH_COOKIE_PATH:/}
  # Remitente y enlaces usados en los correos de notificación
  mail:
    from: ${MAIL_FROM:no-reply@edulibre.com}
    from-name: ${MAIL_FROM_NAME:EduLibre}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}